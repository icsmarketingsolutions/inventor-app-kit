name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: PowerShell generator tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1
          pwsh -NoProfile -File ./scripts/test-powershell.ps1
      - run: npm run privacy

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/web-app/package-lock.json
      - run: npm ci
      - name: Start local Supabase (public output redacted)
        shell: bash
        run: |
          set -o pipefail
          npx --no-install supabase start 2>&1 \
            | node ../../scripts/redact-supabase-output.mjs
      - run: npx --no-install supabase db reset
      - run: npx --no-install supabase test db
      - run: npx --no-install supabase db lint --local --schema public --level warning --fail-on warning
      - run: npx --no-install supabase db advisors --local --type security --level info --fail-on warn
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
