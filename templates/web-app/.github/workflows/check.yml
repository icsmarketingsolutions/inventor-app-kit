name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: npm run privacy

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase (public output redacted)
        shell: bash
        run: |
          set -o pipefail
          npx --no-install supabase start 2>&1 \
            | node ./scripts/redact-supabase-output.mjs
      - run: npx --no-install supabase db reset
      - run: npx --no-install supabase test db
      - run: npx --no-install supabase db lint --local --schema public --level warning --fail-on warning
      - run: npx --no-install supabase db advisors --local --type security --level info --fail-on warn
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
